{% extends 'base.html' %}

{% block content %}
<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4 xl-2">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="text-center mb-4 login-heading-color">Welcome to Quiz Master</h2>
          <p class="text-center text-muted">Login to your account</p>

          <form method="POST" id="loginForm">
            <div class="form-group">
              <label for="username">Username (Email)</label>
              <input type="email" name="username" id="username" class="form-control" placeholder="Enter your email"
                required>
            </div>

            <div class="form-group mt-3">
              <label for="password">Password</label>
              <input type="password" name="password" id="password" class="form-control"
                placeholder="Enter your password" required>
            </div>
            
            <div class="d-grid gap-2 mt-4">
              <button type="button" class="btn btn-primary" id="login">Login</button>
            </div>

            <div class="text-center mt-3">
              <small class="text-muted">Don't have an account?</small><br>
              <a href="{{ url_for('auth.register') }}" class="text-primary">Register here</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Link to login.js -->
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
